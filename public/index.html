                      <div className="flex items-start justify-between gap-3">
                        <div className="flex items-start gap-3">
                          <div className={`w-6 h-6 rounded-lg flex items-center justify-center text-xs font-bold mt-0.5 shrink-0 transition-colors ${
                            isChecked ? 'bg-safetyEmerald text-canvas' : 'bg-canvas border border-white/20 text-transparent'
                          }`}>
                            ✓
                          </div>
                          <div>
                            <h3 className={`text-sm sm:text-base font-bold transition-colors ${
                              isChecked ? 'text-safetyEmeraldLight line-through opacity-80' : 'text-white'
                            }`}>
                              {item.id}. {item.q}
                            </h3>
                            <p className="text-xs text-textSecondary mt-1">
                              ⚠️ 風險說明：{item.risk}
                            </p>
                          </div>
                        </div>

                        <button
                          onClick={(e) => {
                            e.stopPropagation();
                            toggleGuide(item.id);
                          }}
                          className="px-2.5 py-1 rounded-lg text-xs font-medium bg-canvas/60 text-riverCyanLight border border-riverCyan/20 hover:bg-canvas"
                        >
                          {isGuideOpen ? '收起指引' : '觀察指引'}
                        </button>
                      </div>

                      {isGuideOpen && (
                        <div className="mt-3 pt-3 border-t border-white/10 text-xs text-riverGlacier glass-inner rounded-xl p-3">
                          <span className="font-bold text-riverCyanLight block mb-1">🔍 現場觀察操作方法：</span>
                          {item.guide}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>

              {/* Reset button */}
              <div className="flex justify-end pt-2">
                <button
                  onClick={() => setChecklistState({})}
                  className="text-xs text-textMuted hover:text-white px-3 py-1.5 rounded-lg border border-white/10"
                >
                  重設所有勾選狀態
                </button>
              </div>
            </main>
          )}

          {/* TAB 4: CASE STUDIES */}
          {activeTab === 'cases' && (
            <main className="mx-4 mt-4 flex flex-col gap-6">
              <div className="glass-card rounded-2xl p-5 border border-white/10">
                <div className="flex items-center gap-2 mb-2">
                  <span className="px-2.5 py-1 rounded bg-accentGold text-canvas text-xs font-bold">
                    實戰模擬
                  </span>
                  <span className="text-xs text-textMuted font-medium">5 個真實山難案例剖析</span>
                </div>
                <h2 className="text-lg sm:text-xl font-extrabold text-white">
                  山岳情境實戰演練 (Case Studies)
                </h2>
                <p className="text-xs sm:text-sm text-textSecondary mt-1">
                  請設身處地扮演領隊或決策隊員，點擊選項檢視即時安全回饋與專家深度思維剖析。
                </p>
              </div>

              <div className="flex flex-col gap-6">
                {CASE_STUDIES.map((c) => {
                  const selectedOptId = caseSelections[c.id];
                  const selectedOpt = c.options.find(o => o.id === selectedOptId);

                  return (
                    <div key={c.id} className="glass-card rounded-2xl p-5 sm:p-7 border border-white/10 flex flex-col gap-4 shadow-xl">
                      <div className="flex items-center gap-2 border-b border-white/10 pb-3">
                        <span className="px-2.5 py-1 rounded-md bg-riverCyanDark/40 text-riverCyanLight text-xs font-bold border border-riverCyan/30">
                          {c.tag}
                        </span>
                        <h3 className="text-base sm:text-lg font-bold text-white">
                          {c.title}
                        </h3>
                      </div>

                      <div className="glass-inner rounded-xl p-4 border border-white/5">
                        <span className="text-xs font-bold text-textMuted uppercase tracking-wider block mb-1">
                          📍 現場情境描述
                        </span>
                        <p className="text-xs sm:text-sm text-textPrimary leading-relaxed">
                          {c.situation}
                        </p>
                      </div>

                      <div className="text-xs sm:text-sm font-bold text-accentGold">
                        ❓ 決策提問：{c.question}
                      </div>

                      {/* Options */}
                      <div className="flex flex-col gap-2.5">
                        {c.options.map((opt) => {
                          const isChosen = selectedOptId === opt.id;
                          return (
                            <button
                              key={opt.id}
                              onClick={() => handleCaseSelect(c.id, opt.id)}
                              className={`text-left rounded-xl p-3.5 transition-all text-xs sm:text-sm font-semibold border flex items-center justify-between gap-3 ${
                                isChosen
                                  ? opt.type === 'info'
                                    ? 'bg-safetyEmerald/20 border-safetyEmerald text-safetyEmeraldLight'
                                    : opt.type === 'warning'
                                    ? 'bg-warningAmber/20 border-warningAmber text-warningAmberLight'
                                    : 'bg-hazardRed/20 border-hazardRed text-hazardRedLight'
                                  : 'glass-inner border-white/5 hover:border-white/20 text-textPrimary hover:bg-surface'
                              }`}
                            >
                              <span>{opt.label}</span>
                              <span className="text-xs shrink-0">
                                {isChosen ? '● 已選擇' : '○'}
                              </span>
                            </button>
                          );
                        })}
                      </div>

                      {/* Feedback Display */}
                      {selectedOpt && (
                        <div className={`rounded-xl p-4 border text-xs sm:text-sm leading-relaxed flex flex-col gap-2 ${
                          selectedOpt.type === 'info'
                            ? 'bg-safetyEmerald/15 border-safetyEmerald/40 text-safetyEmeraldLight'
                            : selectedOpt.type === 'warning'
                            ? 'bg-warningAmber/15 border-warningAmber/40 text-warningAmberLight'
                            : 'bg-hazardRed/15 border-hazardRed/40 text-hazardRedLight'
                        }`}>
                          <div className="font-bold flex items-center gap-1.5">
                            <span>{selectedOpt.type === 'info' ? '✅ 安全回饋' : '⚠️ 風險分析'}</span>
                          </div>
                          <div>{selectedOpt.feedback}</div>
                        </div>
                      )}

                      {/* Expert Analysis */}
                      <div className="glass-inner rounded-xl p-4 border border-white/10 flex flex-col gap-2">
                        <span className="text-xs font-bold text-riverCyanLight uppercase tracking-wider">
                          💡 專家深度剖析
                        </span>
                        <p className="text-xs sm:text-sm text-textSecondary leading-relaxed">
                          {c.expert}
                        </p>
                        <div className="mt-2 pt-2 border-t border-white/10 text-xs font-bold text-accentGold">
                          🎯 核心教訓：{c.coreLesson}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </main>
          )}

          {/* FOOTER & COPYRIGHT */}
          <footer className="mx-4 mt-12 pt-6 border-t border-white/10 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-textMuted pb-8">
            <div className="text-center sm:text-left">
              <div className="text-textPrimary font-bold">
                {BRAND_NAME} • 安全技術教案編輯部
              </div>
              <p className="mt-0.5">
                山永遠在，把全隊平安帶回家才是唯一的成功。
              </p>
            </div>
            <div className="flex items-center gap-3">
              <a
                href={REFERENCE_URL}
                target="_blank"
                rel="noopener noreferrer"
                className="text-riverCyanLight hover:underline"
              >
                參考渡溪技術概念來源
              </a>
              <span>•</span>
              <button 
                onClick={handleExportHtml}
                className="text-textPrimary hover:text-riverCyanLight font-semibold"
              >
                下載單檔 HTML
              </button>
            </div>
          </footer>
        </div>
      );
    }

    // Render React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
